name: Cleanup Rendered Clips

on:
  schedule:
    # Keep GitHub-hosted rendered MP4 output within a 72-hour window.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-rendered-clips-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove Expired Rendered Clips
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clean rendered clips older than 72 hours
        run: |
          python3 tools/cleanup_rendered_clips.py --retention-hours 72

      - name: Commit cleanup to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rendered-clips
          if git diff --cached --quiet; then
            echo "No expired rendered clips to clean."
            exit 0
          fi
          git commit -m "chore: cleanup rendered clips"
          git pull --rebase origin main
          git push origin HEAD:main
