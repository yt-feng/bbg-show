name: Daily ARK Invest Videos

on:
  schedule:
    # 07:30 and 19:30 Asia/Shanghai.
    - cron: "30 23,11 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Output date in YYYY-MM-DD. Defaults to today in Asia/Shanghai."
        required: false
        type: string
        default: ""
      feed_url:
        description: "ARK Invest RSS feed URL."
        required: false
        type: string
        default: "https://www.ark-invest.com/feed"
      max_videos:
        description: "Maximum new ARK videos to process."
        required: false
        type: number
        default: 1
      lookback_days:
        description: "How far back to look for new Cathie Wood videos."
        required: false
        type: number
        default: 45
      force_reprocess:
        description: "Ignore processed URL state and reprocess the latest matching videos."
        required: false
        type: boolean
        default: false
      font_preset:
        description: "Overlay font preset."
        required: false
        type: choice
        options:
          - noto-serif-sc
          - noto-sc
          - wqy-zenhei
          - wqy-microhei
        default: noto-serif-sc

permissions:
  contents: write

concurrency:
  group: daily-ark-invest-videos-main
  cancel-in-progress: false

jobs:
  ark-videos:
    name: Scrape ARK Feed → Render → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUN_DATE_INPUT: ${{ github.event.inputs.run_date || '' }}
      FEED_URL: ${{ github.event.inputs.feed_url || 'https://www.ark-invest.com/feed' }}
      MAX_VIDEOS_INPUT: ${{ github.event.inputs.max_videos || '1' }}
      LOOKBACK_DAYS_INPUT: ${{ github.event.inputs.lookback_days || '45' }}
      FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess || 'false' }}
      FONT_PRESET: ${{ github.event.inputs.font_preset || 'noto-serif-sc' }}
      STATE_FILE: rendered-clips/ark-invest/processed_urls.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-base
          key: whisper-model-base

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install faster-whisper Pillow

      - name: Resolve run settings
        run: |
          if [ -n "$RUN_DATE_INPUT" ]; then
            RUN_DATE="$RUN_DATE_INPUT"
          else
            RUN_DATE=$(TZ=Asia/Shanghai date +%F)
          fi

          MAX_VIDEOS="$MAX_VIDEOS_INPUT"
          if [ -z "$MAX_VIDEOS" ] || [ "$MAX_VIDEOS" -lt 1 ]; then
            MAX_VIDEOS=1
          fi
          if [ "$MAX_VIDEOS" -gt 3 ]; then
            MAX_VIDEOS=3
          fi

          LOOKBACK_DAYS="$LOOKBACK_DAYS_INPUT"
          if [ -z "$LOOKBACK_DAYS" ] || [ "$LOOKBACK_DAYS" -lt 1 ]; then
            LOOKBACK_DAYS=45
          fi

          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "MAX_VIDEOS=$MAX_VIDEOS" >> "$GITHUB_ENV"
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS" >> "$GITHUB_ENV"
          echo "RUN_DATE=$RUN_DATE"
          echo "MAX_VIDEOS=$MAX_VIDEOS"
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS"

      - name: Scrape ARK Invest feed
        id: scrape
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p work/ark-invest
          ARGS=(
            --feed-url "$FEED_URL"
            --out work/ark-invest/ark_videos.json
            --state "$STATE_FILE"
            --max-videos "$MAX_VIDEOS"
            --lookback-days "$LOOKBACK_DAYS"
          )
          if [ "$FORCE_REPROCESS" = "true" ]; then
            ARGS+=(--ignore-state)
          fi
          python tools/scrape_ark_invest_videos.py "${ARGS[@]}"

          ARK_VIDEO_COUNT=$(python -c 'import json; print(json.load(open("work/ark-invest/ark_videos.json"))["count"])')
          echo "ARK_VIDEO_COUNT=$ARK_VIDEO_COUNT" >> "$GITHUB_ENV"
          echo "video_count=$ARK_VIDEO_COUNT" >> "$GITHUB_OUTPUT"
          echo "ARK_VIDEO_COUNT=$ARK_VIDEO_COUNT"

      - name: Process ARK videos
        if: ${{ steps.scrape.outputs.video_count != '0' }}
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BLOOMBERG_PROXY_SUBSCRIPTION_URL: ${{ secrets.BLOOMBERG_PROXY_SUBSCRIPTION_URL }}
          BBG_OVERLAY_FONT_PRESET: ${{ env.FONT_PRESET }}
        run: |
          python tools/process_ark_videos.py \
            --manifest work/ark-invest/ark_videos.json \
            --run-date "$RUN_DATE" \
            --max-videos "$MAX_VIDEOS" \
            --out-root rendered-clips \
            --work-root work/ark-invest \
            --state "$STATE_FILE" \
            --threads 2 \
            --yt-dlp-proxy-mode auto \
            --max-clip-seconds 110

      - name: Verify rendered ARK clips
        if: ${{ steps.scrape.outputs.video_count != '0' }}
        run: |
          OUTPUT_DIR="rendered-clips/${RUN_DATE}/ark-invest"
          CLIP_COUNT=$(find "$OUTPUT_DIR" -type f -name '*.mp4' | wc -l | tr -d ' ')
          echo "Rendered ARK MP4 count: $CLIP_COUNT"
          if [ "$CLIP_COUNT" -lt 1 ]; then
            echo "No rendered ARK clips produced" >&2
            exit 1
          fi
          find "$OUTPUT_DIR" -maxdepth 3 -type f -print -exec ls -lh {} \;

      - name: Clean rendered clips older than 72 hours
        run: |
          python3 tools/cleanup_rendered_clips.py --retention-hours 72

      - name: Commit rendered clips to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rendered-clips
          if git diff --cached --quiet; then
            echo "No ARK rendered clip changes to commit."
            exit 0
          fi
          git commit -m "chore: publish ARK Invest videos ${RUN_DATE}"
          git pull --rebase origin main
          git push origin HEAD:main
