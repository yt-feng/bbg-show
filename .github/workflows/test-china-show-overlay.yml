name: Test China Show Overlay

on:
  workflow_dispatch:
    inputs:
      show_date:
        description: "China Show date in YYYY-MM-DD."
        required: false
        type: string
        default: "2026-06-26"
      url:
        description: "Optional Bloomberg video URL override."
        required: false
        type: string
        default: ""
      max_speakers:
        description: "Maximum speakers to test."
        required: false
        type: number
        default: 1
      clips_per_speaker:
        description: "Maximum clips per speaker to test."
        required: false
        type: number
        default: 1
      font_preset:
        description: "Overlay font preset."
        required: false
        type: choice
        options:
          - noto-serif-sc
          - noto-sc
          - wqy-zenhei
          - wqy-microhei
        default: noto-serif-sc

permissions:
  contents: read

concurrency:
  group: test-china-show-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-overlay:
    name: Render One Test Clip
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SHOW_DATE_INPUT: ${{ github.event.inputs.show_date || '2026-06-26' }}
      SHOW_TYPE_INPUT: china
      URL_INPUT: ${{ github.event.inputs.url || '' }}
      MAX_SPEAKERS: ${{ github.event.inputs.max_speakers || '1' }}
      CLIPS_PER_SPEAKER: ${{ github.event.inputs.clips_per_speaker || '1' }}
      FONT_PRESET: ${{ github.event.inputs.font_preset || 'noto-serif-sc' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .github/**
            tools
            tools/**
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-base
          key: whisper-model-base

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install faster-whisper Pillow

      - name: Resolve Bloomberg show URL
        run: |
          mkdir -p work/test-overlay
          python tools/resolve_china_show_url.py \
            --show-date "$SHOW_DATE_INPUT" \
            --show-type "$SHOW_TYPE_INPUT" \
            --url "$URL_INPUT" \
            --github-env "$GITHUB_ENV" \
            --metadata work/test-overlay/show.json

      - name: Use test output directory
        run: |
          echo "OUTPUT_DIR=rendered-clips/test-overlay/${SHOW_DATE}" >> "$GITHUB_ENV"

      - name: Download Bloomberg video
        env:
          PYTHONUNBUFFERED: "1"
          BLOOMBERG_PROXY_SUBSCRIPTION_URL: ${{ secrets.BLOOMBERG_PROXY_SUBSCRIPTION_URL }}
        run: |
          python tools/download_bloomberg_video.py \
            --url "$SHOW_URL" \
            --download-backend auto \
            --yt-dlp-proxy-mode auto \
            --output-dir downloads \
            --work-dir work/test-overlay/download \
            --workers 32 \
            --no-strategy-cache

      - name: Identify video file
        run: |
          VIDEO_FILE=$(find downloads -type f -name '*.mp4' | head -1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "No MP4 found in downloads/" >&2
            exit 1
          fi
          echo "VIDEO_FILE=$VIDEO_FILE" >> "$GITHUB_ENV"
          echo "Downloaded: $VIDEO_FILE"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO_FILE"

      - name: Transcribe full show
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tools/transcribe_video.py \
            --video "$VIDEO_FILE" \
            --out work/test-overlay/transcript.json \
            --model base \
            --language en \
            --force

      - name: Select keynote speaker
        env:
          PYTHONUNBUFFERED: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python tools/select_daily_speakers.py \
            --transcript work/test-overlay/transcript.json \
            --show-date "$SHOW_DATE" \
            --out work/test-overlay/speakers.json \
            --max-speakers "$MAX_SPEAKERS"

      - name: Plan, refine title, and add KC comment
        env:
          PYTHONUNBUFFERED: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python tools/plan_daily_highlights.py \
            --transcript work/test-overlay/transcript.json \
            --speakers work/test-overlay/speakers.json \
            --out-dir work/test-overlay/speaker_plans \
            --combined-plan work/test-overlay/highlight_plan.json \
            --min-seconds 30 \
            --max-seconds 150 \
            --min-clips 1 \
            --max-clips "$CLIPS_PER_SPEAKER"

      - name: Render test clip
        env:
          PYTHONUNBUFFERED: "1"
          BBG_OVERLAY_FONT_PRESET: ${{ env.FONT_PRESET }}
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          python tools/render_clips_linux.py \
            --source "$VIDEO_FILE" \
            --plan work/test-overlay/highlight_plan.json \
            --out-dir "$OUTPUT_DIR" \
            --work-dir work/test-overlay/render \
            --threads 2 \
            --force

      - name: Copy metadata
        run: |
          cp work/test-overlay/show.json "$OUTPUT_DIR/show.json"
          cp work/test-overlay/speakers.json "$OUTPUT_DIR/speakers.json"
          cp work/test-overlay/highlight_plan.json "$OUTPUT_DIR/highlight_plan.json"
          if [ -f work/test-overlay/title_refine_log.json ]; then
            cp work/test-overlay/title_refine_log.json "$OUTPUT_DIR/title_refine_log.json"
          fi
          find "$OUTPUT_DIR" -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Verify rendered test clip
        run: |
          CLIP_COUNT=$(find "$OUTPUT_DIR" -type f -name '*.mp4' | wc -l | tr -d ' ')
          echo "Rendered MP4 count: $CLIP_COUNT"
          if [ "$CLIP_COUNT" -lt 1 ]; then
            echo "No rendered test clips produced" >&2
            exit 1
          fi

      - name: Upload rendered test clip
        uses: actions/upload-artifact@v5
        with:
          name: test-china-show-overlay-${{ github.event.inputs.show_date || '2026-06-26' }}
          path: rendered-clips/test-overlay/
          if-no-files-found: error
          retention-days: 7
