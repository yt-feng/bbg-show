name: Daily Bloomberg Show Clips

on:
  schedule:
    # 03:00 Asia/Shanghai = 19:00 UTC on the previous calendar day.
    # Tuesday-Saturday Beijing runs clip the previous day's Bloomberg China Show.
    - cron: "0 19 * * 1-5"
    # Sunday-Monday Beijing runs clip the previous day's Bloomberg Weekend.
    - cron: "0 19 * * 6,0"
    # Backup run for delayed Bloomberg publishes: 07:30 Asia/Shanghai = 23:30 UTC.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      show_date:
        description: "Show date in YYYY-MM-DD. Defaults to yesterday in Asia/Shanghai."
        required: false
        type: string
        default: ""
      show_type:
        description: "Bloomberg show type."
        required: false
        type: choice
        options:
          - auto
          - china
          - weekend
        default: auto
      url:
        description: "Override Bloomberg video URL."
        required: false
        type: string
        default: ""
      max_speakers:
        description: "Maximum keynote speakers to process."
        required: false
        type: number
        default: 3
      clips_per_speaker:
        description: "Maximum highlight clips per speaker."
        required: false
        type: number
        default: 5
      font_preset:
        description: "Overlay font preset."
        required: false
        type: choice
        options:
          - noto-serif-sc
          - noto-sc
          - wqy-zenhei
          - wqy-microhei
        default: noto-serif-sc

permissions:
  contents: write

concurrency:
  group: daily-bloomberg-show-main
  cancel-in-progress: false

jobs:
  daily-clips:
    name: Download → Select Speakers → Render → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SHOW_DATE_INPUT: ${{ github.event.inputs.show_date || '' }}
      SHOW_TYPE_INPUT: ${{ github.event.inputs.show_type || 'auto' }}
      URL_INPUT: ${{ github.event.inputs.url || '' }}
      MAX_SPEAKERS: ${{ github.event.inputs.max_speakers || '3' }}
      CLIPS_PER_SPEAKER: ${{ github.event.inputs.clips_per_speaker || '5' }}
      FONT_PRESET: ${{ github.event.inputs.font_preset || 'noto-serif-sc' }}
      WEEKEND_PROCESSED_SHOWS: rendered-clips/weekend/processed_shows.json
      SHOW_SOURCE_LEDGER: rendered-clips/show_sources.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve Bloomberg show URL
        run: |
          mkdir -p work/daily
          python tools/resolve_china_show_url.py \
            --show-date "$SHOW_DATE_INPUT" \
            --show-type "$SHOW_TYPE_INPUT" \
            --url "$URL_INPUT" \
            --weekend-processed-shows "$WEEKEND_PROCESSED_SHOWS" \
            --github-env "$GITHUB_ENV" \
            --metadata work/daily/show.json

      - name: Check existing rendered show clips
        id: existing_clips
        run: |
          if [ "${SKIP_SHOW:-false}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${SHOW_SKIP_REASON:-No Bloomberg show selected; skipping.}"
          elif [ -d "$OUTPUT_DIR" ] && [ -n "$(find "$OUTPUT_DIR" -maxdepth 2 -type f -name '*.mp4' -print -quit)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Rendered clips already exist in $OUTPUT_DIR; skipping duplicate run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No rendered clips found in $OUTPUT_DIR; continuing."
          fi

      - name: Cache Whisper model
        if: steps.existing_clips.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-base
          key: whisper-model-base

      - name: Install dependencies
        if: steps.existing_clips.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install faster-whisper Pillow

      - name: Download Bloomberg video
        id: download
        if: steps.existing_clips.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          BLOOMBERG_PROXY_SUBSCRIPTION_URL: ${{ secrets.BLOOMBERG_PROXY_SUBSCRIPTION_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Download attempt $attempt/3"
            set +e
            python tools/download_bloomberg_video.py \
              --url "$SHOW_URL" \
              --download-backend auto \
              --yt-dlp-proxy-mode auto \
              --output-dir downloads \
              --work-dir work/download \
              --workers 32 \
              --keep-tmp \
              --no-strategy-cache
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "source_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              if [ "$status" -eq 75 ]; then
                echo "::warning::Bloomberg still exposes an ambiguous or stale source; leaving this run green so the backup schedule can retry."
                echo "source_ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit "$status"
            fi
            if [ "$SHOW_TYPE" = "weekend" ] && [ "$SHOW_RESOLUTION_SOURCE" != "explicit" ]; then
              sleep_seconds=$((attempt * 60))
            else
              sleep_seconds=$((attempt * 600))
            fi
            echo "Bloomberg source not ready yet; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

      - name: Identify video file
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true'
        run: |
          VIDEO_FILE=$(find downloads -type f -name '*.mp4' | head -1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "No MP4 found in downloads/" >&2
            exit 1
          fi
          echo "VIDEO_FILE=$VIDEO_FILE" >> "$GITHUB_ENV"
          echo "Downloaded: $VIDEO_FILE"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO_FILE"

      - name: Reject stale or previously published Bloomberg asset
        id: source_guard_initial
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true'
        run: |
          python tools/show_source_guard.py check \
            --show-metadata work/daily/show.json \
            --download-plan work/download/download_plan.json \
            --manifest work/download/embed_manifest.json \
            --ledger "$SHOW_SOURCE_LEDGER" \
            --rendered-root rendered-clips \
            --identity-output work/daily/source_identity.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Transcribe full show
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tools/transcribe_video.py \
            --video "$VIDEO_FILE" \
            --out work/daily/transcript.json \
            --model base \
            --language en \
            --force

      - name: Reject repeated show content
        id: source_guard_transcript
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true'
        run: |
          python tools/show_source_guard.py check \
            --show-metadata work/daily/show.json \
            --download-plan work/download/download_plan.json \
            --manifest work/download/embed_manifest.json \
            --transcript work/daily/transcript.json \
            --ledger "$SHOW_SOURCE_LEDGER" \
            --rendered-root rendered-clips \
            --identity-output work/daily/source_identity.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Select keynote speakers
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true'
        id: select_speakers
        env:
          PYTHONUNBUFFERED: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python tools/select_daily_speakers.py \
            --transcript work/daily/transcript.json \
            --show-date "$SHOW_DATE" \
            --out work/daily/speakers.json \
            --max-speakers "$MAX_SPEAKERS" \
            --allow-empty

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          payload = json.load(open("work/daily/speakers.json", encoding="utf-8"))
          speakers = payload.get("speakers")
          if not isinstance(speakers, list):
              raise SystemExit("speakers.json must contain a speakers list")
          expected_status = "selected" if speakers else "no_eligible_speakers"
          if payload.get("selection_status") != expected_status:
              raise SystemExit("speakers.json selection_status does not match its speakers list")
          print(f"speaker_count={len(speakers)}")
          print(f"has_speakers={'true' if speakers else 'false'}")
          print(f"selection_status={expected_status}")
          PY

      - name: Plan speaker highlights
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && steps.select_speakers.outputs.has_speakers == 'true'
        id: plan_highlights
        env:
          PYTHONUNBUFFERED: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python tools/plan_daily_highlights.py \
            --transcript work/daily/transcript.json \
            --speakers work/daily/speakers.json \
            --out-dir work/daily/speaker_plans \
            --combined-plan work/daily/highlight_plan.json \
            --min-seconds 30 \
            --max-seconds 150 \
            --min-clips 3 \
            --max-clips "$CLIPS_PER_SPEAKER" \
            --allow-empty

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          payload = json.load(open("work/daily/highlight_plan.json", encoding="utf-8"))
          clips = payload.get("clips")
          if not isinstance(clips, list):
              raise SystemExit("highlight_plan.json must contain a clips list")
          expected_status = "planned" if clips else "no_eligible_clips"
          if payload.get("planning_status") != expected_status:
              raise SystemExit("highlight_plan.json planning_status does not match its clips list")
          print(f"clip_count={len(clips)}")
          print(f"has_clips={'true' if clips else 'false'}")
          print(f"planning_status={expected_status}")
          PY

      - name: Render KC Desktop clips
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && steps.plan_highlights.outputs.has_clips == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          BBG_OVERLAY_FONT_PRESET: ${{ env.FONT_PRESET }}
        run: |
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          python tools/render_clips_linux.py \
            --source "$VIDEO_FILE" \
            --plan work/daily/highlight_plan.json \
            --out-dir "$OUTPUT_DIR" \
            --work-dir work/daily/render \
            --threads 2 \
            --force

      - name: Copy metadata
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && steps.plan_highlights.outputs.has_clips == 'true'
        run: |
          cp work/daily/show.json "$OUTPUT_DIR/show.json"
          cp work/daily/source_identity.json "$OUTPUT_DIR/source_identity.json"
          cp work/daily/speakers.json "$OUTPUT_DIR/speakers.json"
          cp work/daily/highlight_plan.json "$OUTPUT_DIR/highlight_plan.json"
          if [ -f work/daily/title_refine_log.json ]; then
            cp work/daily/title_refine_log.json "$OUTPUT_DIR/title_refine_log.json"
          fi
          find "$OUTPUT_DIR" -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Verify rendered clips
        if: steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && steps.plan_highlights.outputs.has_clips == 'true'
        run: |
          CLIP_COUNT=$(find "$OUTPUT_DIR" -type f -name '*.mp4' | wc -l)
          echo "Rendered MP4 count: $CLIP_COUNT"
          if [ "$CLIP_COUNT" -lt 1 ]; then
            echo "No rendered clips produced" >&2
            exit 1
          fi

      - name: Record processed Bloomberg source
        if: success() && steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true'
        run: |
          python tools/show_source_guard.py record \
            --identity work/daily/source_identity.json \
            --ledger "$SHOW_SOURCE_LEDGER"

      - name: Record Weekend show with no eligible speakers
        if: success() && steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && env.SHOW_TYPE == 'weekend' && steps.select_speakers.outputs.has_speakers == 'false'
        run: |
          python tools/weekend_processed_shows.py record \
            --path "$WEEKEND_PROCESSED_SHOWS" \
            --show-date "$SHOW_DATE" \
            --status no_eligible_speakers

      - name: Record Weekend show with no eligible clips
        if: success() && steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && env.SHOW_TYPE == 'weekend' && steps.select_speakers.outputs.has_speakers == 'true' && steps.plan_highlights.outputs.has_clips == 'false'
        run: |
          python tools/weekend_processed_shows.py record \
            --path "$WEEKEND_PROCESSED_SHOWS" \
            --show-date "$SHOW_DATE" \
            --status no_eligible_clips

      - name: Record rendered Weekend show
        if: success() && steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true' && env.SHOW_TYPE == 'weekend' && steps.plan_highlights.outputs.has_clips == 'true'
        run: |
          python tools/weekend_processed_shows.py record \
            --path "$WEEKEND_PROCESSED_SHOWS" \
            --show-date "$SHOW_DATE" \
            --status rendered \
            --refresh

      - name: Commit rendered clips to main
        if: success() && steps.existing_clips.outputs.skip != 'true' && steps.download.outputs.source_ready == 'true' && steps.source_guard_initial.outputs.duplicate != 'true' && steps.source_guard_transcript.outputs.duplicate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rendered-clips
          if git diff --cached --quiet; then
            echo "No rendered clip changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize ${SHOW_TYPE} show ${SHOW_DATE}"
          git pull --rebase origin main
          git push origin HEAD:main
